<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stint</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#12151C; --surface:#1B202B; --surfaceHi:#232936; --line:#2C3340;
  --text:#E8EAF0; --muted:#79839A;
  --purple:#A17BFF; --green:#3FBF7F; --amber:#F5A524; --red:#E5484B; --teal:#3FB6C4;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
#app{max-width:480px;margin:0 auto;padding:20px 16px 40px;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font:inherit;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.row{display:flex;align-items:center;justify-content:space-between;}
.num-in{background:transparent;border:none;outline:none;text-align:center;
  font-family:var(--mono);font-size:26px;width:52px;color:var(--text);}
.step{width:44px;height:44px;background:var(--surfaceHi);border:1px solid var(--line);
  border-radius:4px;font-size:20px;}
.field{height:44px;background:var(--surfaceHi);border:1px solid var(--line);
  border-radius:4px;color:var(--text);font-family:var(--mono);font-size:17px;text-align:center;width:100%;}
.btn-primary{background:var(--purple);color:#12101C;border-radius:4px;font-family:var(--mono);
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:13px 0;width:100%;
  box-shadow:0 0 7px #A17BFF44,0 0 15px #A17BFF1A;}
.btn-ghost{border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 0;width:100%;}
.link{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);text-decoration:underline;}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}.mt8{margin-top:32px}
.pad{padding:14px 16px}
.strip{display:flex;gap:4px}
.strip>div{flex:1;height:34px;border-radius:2px}
.chart{display:flex;align-items:flex-end;gap:4px;height:52px}
.chart>div{flex:1;position:relative;height:52px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{flex:1;height:74px;padding:0 12px;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;border:1px solid var(--line);
  background:var(--surface);border-radius:4px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------- constants ---------------- */
const KEY = "stint-data-v1";
const VERSION = "2.1";
const BUILT = "2026-08-20";
const C = {line:"#2C3340",purple:"#A17BFF",green:"#3FBF7F",amber:"#F5A524",red:"#E5484B",
           teal:"#3FB6C4",text:"#E8EAF0",muted:"#79839A",surface:"#1B202B"};
const noiseCol=n=>[null,"#3FBF7F","#7FC46A","#F5A524","#E88437","#E5484B"][n];
const glow=(c,s)=>`0 0 ${s*0.5}px ${c}44, 0 0 ${s*1.1}px ${c}1A`;
const tglow=(c,s)=>`0 0 ${s*0.5}px ${c}66, 0 0 ${s}px ${c}26`;

const DEFAULT_SWAPS=[];   // seeded on the phone, never in this file

const UPGRADES=[
 ["Noise rating","One tap, 1-5, for how loud it got at its worst today."],
 ["BP trend line","Rolling 7-day average with a chart."],
 ["The 20-minute timer","Countdown when a craving hits."],
 ["Weekly review card","Sunday summary of what moved."],
 ["Food anchor","Did you eat a real meal before 10am."],
 ["Correlation view","Noise vs drinks, noise vs sleep, what actually turns it down."],
 ["Cost counter","Dollars and hours reclaimed."],
 ["Streak insurance","Two banked skip days a fortnight."],
 ["One-glance view","Today only, four taps, nothing else."],
 ["Export to GP","Printable summary for your doctor."]];

/* ---------------- dates ---------------- */
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const[y,m,d]=s.split("-").map(Number);return iso(new Date(y,m-1,d+n))};
const between=(a,b)=>{const[y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);
  return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000)};
const dayName=s=>{const[y,m,d]=s.split("-").map(Number);
  return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(y,m-1,d).getDay()]};

/* ---------------- storage ---------------- */
let storageOk=true, lastSave=null;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw); if(p&&p.days) return p;}
  }catch(e){storageOk=false;}
  try{localStorage.setItem("__probe","1");localStorage.removeItem("__probe");}
  catch(e){storageOk=false;}
  return {start:iso(new Date()),days:{},claimed:0};
}
function save(){
  try{
    S.lastSave=Date.now();
    localStorage.setItem(KEY,JSON.stringify(S));
    storageOk=true;
  }catch(e){storageOk=false;}
}
let S=load();

/* ---------------- session state ---------------- */
let picked=null, rerolls=0, editSwaps=false, editTaper=false, editLabels=false,
    showRoadmap=false, showExport=false, confirmWipe=false;
const today=iso(new Date());

/* ---------------- derived ---------------- */
const day=()=>S.days[today]||{};
const swaps=()=>S.swaps||DEFAULT_SWAPS;
function targetFor(ds){
  if(!S.taper) return null;
  const e=between(S.taper.startDate,ds);
  if(e<0) return S.taper.startDrinks;
  return Math.max(S.taper.floor, S.taper.startDrinks - S.taper.step*Math.floor(e/S.taper.everyDays));
}
function sectorColor(ds){
  const d=S.days[ds];
  if(!d||!d.touched) return C.line;
  const am=(d.medsAM??d.meds)?1:0, pm=(d.medsPM??d.meds)?1:0;
  const t=targetFor(ds);
  const on=typeof d.drinks==="number" && (t===null? d.drinks===0 : d.drinks<=t);
  const g=am+pm+(on?1:0)+(d.swap?1:0)+(d.teethAM?1:0)+(d.teethPM?1:0);
  return g>=6?C.purple:g>=4?C.green:g>=2?C.amber:C.red;
}
function patch(f){
  S.days[today]=Object.assign({},day(),f,{touched:true});
  save(); render();
}

/* ---------------- render ---------------- */
function render(){
  const d=day(), dayN=between(S.start,today)+1;
  const cycle=Math.floor((dayN-1)/7)+1;
  const fnStart=addDays(S.start,(cycle-1)*7);
  let logged=0;
  for(let i=0;i<7;i++){const ds=addDays(fnStart,i);
    if(between(ds,today)>=0 && S.days[ds]&&S.days[ds].touched) logged++;}
  const canClaim=logged>=5 && (S.claimed||0)<cycle;
  const up=UPGRADES[Math.min(S.claimed||0,UPGRADES.length-1)];

  const strip=[]; for(let i=13;i>=0;i--) strip.push(addDays(today,-i));
  const y1=S.days[addDays(today,-1)], y2=S.days[addDays(today,-2)];
  const blackFlag=!(y1&&y1.touched)&&!(y2&&y2.touched)&&dayN>3;

  const t=targetFor(today);
  const delta=(t!==null&&typeof d.drinks==="number")?d.drinks-t:null;
  const nextStep=S.taper? S.taper.everyDays-(between(S.taper.startDate,today)%S.taper.everyDays)-1:null;

  const wDays=Object.keys(S.days).filter(k=>S.days[k].wegovy).sort();
  const lastW=wDays.length?wDays[wDays.length-1]:null;
  const sinceW=lastW?between(lastW,today):null;
  const wDue=sinceW===null||sinceW>=7;

  const last28=[]; for(let i=27;i>=0;i--) last28.push(addDays(today,-i));
  const dd=last28.filter(k=>S.days[k]&&typeof S.days[k].drinks==="number");
  const perWeek=dd.length?((dd.reduce((s,k)=>s+S.days[k].drinks,0)/dd.length)*7).toFixed(1):"—";
  const onPlanDays=dd.filter(k=>{const tt=targetFor(k);return tt===null?S.days[k].drinks===0:S.days[k].drinks<=tt}).length;
  const bpKeys=Object.keys(S.days).filter(k=>S.days[k].bp).sort();
  const lastBP=bpKeys.length?S.days[bpKeys[bpKeys.length-1]].bp:null;

  const h=[];
  h.push(`<div class="row" style="align-items:flex-end">
    <div><div class="eyebrow">Day</div>
    <div class="mono" style="font-size:40px;font-weight:600;line-height:1;text-shadow:${tglow(C.text,10)}">${String(dayN).padStart(3,"0")}</div></div>
    <div style="text-align:right"><div class="eyebrow">Week ${cycle}</div>
    <div class="mono" style="font-size:13px;color:var(--muted);margin-top:4px">${dayName(today)} · ${today}</div></div>
  </div>`);

  if(!storageOk) h.push(`<div class="card pad mt3" style="border-color:${C.red};background:#241315">
    <div class="eyebrow" style="color:${C.red}">Not saving</div>
    <div style="font-size:14px;margin-top:4px">Storage is blocked on this browser. Check you're not in private mode.</div></div>`);

  if(S.demo) h.push(`<div class="card pad mt3" style="border-color:${C.purple};background:#1D1630">
    <div class="eyebrow" style="color:${C.purple}">Sample data</div>
    <div style="font-size:14px;margin-top:4px">Fake days, for a look around. Wipe before logging anything real.</div></div>`);

  if(blackFlag) h.push(`<div class="card pad mt3" style="border-color:${C.amber};background:#241C10">
    <div class="eyebrow" style="color:${C.amber}">Missed twice</div>
    <div style="font-size:14px;margin-top:4px">Two blank days. Log something today and it's over.</div></div>`);

  /* meds */
  h.push(`<div class="eyebrow mt6">Today</div>`);
  const labels=S.medLabels||{am:"",pm:""};
  const medBtn=(k,label,drugs)=>{
    const on=(d[k]??d.meds)?true:false;
    return `<button class="tog" data-act="med" data-k="${k}"
      style="background:${on?"#16241E":"var(--surface)"};border-color:${on?C.green:C.line};
             box-shadow:${on?glow(C.green,10):"none"}">
      <span style="font-size:14px">${label}</span>
      ${drugs?`<span class="mono" style="font-size:9px;color:var(--muted);margin-top:2px">${drugs}</span>`:""}
      <span class="mono" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;
        color:${on?C.green:C.muted};text-shadow:${on?tglow(C.green,8):"none"}">${on?"Taken":"Not yet"}</span>
    </button>`;
  };
  h.push(`<div class="mt2" style="display:flex;gap:8px">
    ${medBtn("medsAM","Day",labels.am||"")}
    ${medBtn("medsPM","Night",labels.pm||"")}</div>`);
  const teeth=(k,label)=>{
    const on=!!d[k];
    return `<button data-act="teeth" data-k="${k}" style="flex:1;height:52px;padding:0 12px;
      display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
      border:1px solid ${on?C.teal:C.line};border-radius:4px;text-align:left;
      background:${on?"#12262B":"var(--surface)"};box-shadow:${on?glow(C.teal,10):"none"}">
      <span style="font-size:13px">${label}</span>
      <span class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;
        color:${on?C.teal:C.muted}">${on?"Done":"—"}</span></button>`;
  };
  h.push(`<div class="mt2" style="display:flex;gap:8px">
    ${teeth("teethAM","Brush · morning")}${teeth("teethPM","Brush · night")}</div>`);
  h.push(`<div class="row mt2"><span></span><button class="link" data-act="editlabels">${editLabels?"Done":"Edit med names"}</button></div>`);
  if(editLabels) h.push(`<div class="card pad mt2">
    <div style="font-size:13px;color:var(--muted);line-height:1.5">Stored on this phone only. Never written to the hosted file.</div>
    <div class="mt3"><div class="eyebrow" style="font-size:9px">Morning</div>
      <input id="labAm" class="field" style="text-align:left;padding:0 10px;font-size:14px;margin-top:4px" value="${(labels.am||"").replace(/"/g,"&quot;")}"></div>
    <div class="mt3"><div class="eyebrow" style="font-size:9px">Night</div>
      <input id="labPm" class="field" style="text-align:left;padding:0 10px;font-size:14px;margin-top:4px" value="${(labels.pm||"").replace(/"/g,"&quot;")}"></div>
    <div class="mt3"><div class="eyebrow" style="font-size:9px">Weekly</div>
      <input id="labWk" class="field" style="text-align:left;padding:0 10px;font-size:14px;margin-top:4px" value="${(labels.weekly||"").replace(/"/g,"&quot;")}"></div>
    <button class="btn-primary mt3" data-act="savelabels">Save</button></div>`);

  h.push(`<button class="card pad mt2 row" data-act="wegovy" style="width:100%;
    border-color:${d.wegovy?C.green:wDue?C.amber:C.line};
    background:${d.wegovy?"#16241E":"var(--surface)"};
    box-shadow:${d.wegovy?glow(C.green,10):wDue?glow(C.amber,8):"none"}">
    <span style="font-size:14px">${labels.weekly||"Weekly meds"} <span class="mono" style="font-size:9px;color:var(--muted)">weekly</span></span>
    <span class="mono" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;
      color:${d.wegovy?C.green:wDue?C.amber:C.muted}">
      ${d.wegovy?"Injected":sinceW===null?"Not logged":wDue?"Due":(7-sinceW)+"d"}</span></button>`);

  /* drinks */
  h.push(`<div class="card pad mt2">
    <div class="row"><span style="font-size:16px">Standard drinks</span>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="step" data-act="dminus">−</button>
        <input id="drinks" class="num-in" inputmode="numeric" placeholder="–"
          value="${typeof d.drinks==="number"?d.drinks:""}"
          style="color:${d.drinks===0?C.green:C.text};text-shadow:${d.drinks===0?tglow(C.green,12):tglow(C.text,8)}">
        <button class="step" data-act="dplus">+</button>
      </div></div>
    ${typeof d.drinks!=="number"?`<button class="btn-ghost mt3" data-act="dzero">Log a zero</button>`:""}
  </div>`);

  /* taper */
  if(!S.taper||editTaper){
    const v=S.taper||{startDrinks:10,step:1,everyDays:7,floor:0};
    h.push(`<div class="card pad mt2">
      <div class="eyebrow">${S.taper?"Adjust schedule":"Set your taper"}</div>
      <div style="font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5">
        Enter the schedule you've been given. Changing it re-bases from today.</div>
      <div class="grid2 mt3">
        ${[["Start at","tStart",v.startDrinks],["Drop by","tStep",v.step],
           ["Every (days)","tEvery",v.everyDays],["Hold at","tFloor",v.floor]]
          .map(([l,id,val])=>`<div><div class="eyebrow" style="font-size:9px">${l}</div>
            <input id="${id}" class="field" inputmode="numeric" value="${val}" style="margin-top:4px"></div>`).join("")}
      </div>
      <button class="btn-primary mt3" data-act="savetaper">${S.taper?"Update":"Start"}</button>
      ${S.taper?`<button class="link mt3" data-act="canceltaper" style="width:100%">Cancel</button>`:""}
    </div>`);
  } else {
    const dcol=delta>0?C.amber:delta<-2?C.teal:C.green;
    h.push(`<div class="card pad mt2">
      <div class="row" style="align-items:baseline">
        <span class="eyebrow">Today's target</span>
        <span class="mono" style="font-size:10px;color:var(--muted)">${nextStep===0?"drops tomorrow":"drops in "+nextStep+"d"}</span>
      </div>
      <div class="row mt2" style="align-items:flex-end">
        <div class="mono" style="font-size:44px;line-height:1;font-weight:600;color:${C.purple};text-shadow:${tglow(C.purple,16)}">${t}</div>
        ${delta!==null?`<div style="text-align:right">
          <div class="mono" style="font-size:26px;line-height:1;color:${dcol};text-shadow:${tglow(dcol,12)}">${delta>0?"+":""}${delta}</div>
          <div class="eyebrow" style="font-size:9px;margin-top:4px">${delta>0?"over":delta<-2?"well under":"on plan"}</div>
        </div>`:""}
      </div>
      <div class="chart mt4">${strip.map(ds=>{
        const a=S.days[ds]?S.days[ds].drinks:undefined, tt=targetFor(ds);
        const sc=Math.max(S.taper.startDrinks,1);
        const hh=typeof a==="number"?Math.max(2,(a/sc)*52):0;
        const th=tt!==null?Math.max(1,(tt/sc)*52):0;
        const bc=typeof a!=="number"?C.line:a>tt?C.amber:a<tt-2?C.teal:C.green;
        return `<div>
          <div style="position:absolute;bottom:0;width:100%;height:${hh}px;background:${bc};
            box-shadow:${hh>0?glow(bc,7):"none"};border-radius:2px;opacity:.9"></div>
          <div style="position:absolute;bottom:${th}px;width:100%;height:1px;background:${C.purple};
            box-shadow:${glow(C.purple,5)};opacity:.85"></div></div>`}).join("")}</div>
      <div class="row mt2"><span class="mono" style="font-size:10px;color:var(--muted)">bars = actual · line = target</span>
        <button class="link" data-act="edittaper">Adjust</button></div>
    </div>`);
  }

  /* swap */
  h.push(`<div class="card pad mt2" style="border-color:${d.swap?C.purple:C.line};
    background:${d.swap?"#1D1630":"var(--surface)"};box-shadow:${d.swap?glow(C.purple,10):"none"}">
    <div class="row" style="align-items:baseline"><span class="eyebrow">The swap</span>
      <button class="link" data-act="editswaps">${editSwaps?"Done":"Edit list ("+swaps().length+")"}</button></div>
    ${editSwaps
      ? `<div class="mt3">${swaps().map(s=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)">
          <span style="font-size:14px">${s}</span>
          <button class="mono" data-act="rmswap" data-s="${encodeURIComponent(s)}"
            style="font-size:15px;color:var(--muted);padding:0 8px">×</button></div>`).join("")}
        <div class="mt3" style="display:flex;gap:8px">
          <input id="newswap" class="field" placeholder="Add something" style="text-align:left;padding:0 10px;font-family:inherit;font-size:14px">
          <button class="mono" data-act="addswap" style="padding:0 16px;background:var(--surfaceHi);border:1px solid var(--line);border-radius:4px;font-size:12px">ADD</button>
        </div></div>`
      : d.swap
      ? `<div class="mt3"><div style="font-size:16px;color:${C.purple};text-shadow:${tglow(C.purple,10)}">${d.swapWhat||"Done"}</div>
         <button class="link mt2" data-act="undoswap">Undo</button></div>`
      : swaps().length===0
      ? `<div class="mt3" style="font-size:14px;color:var(--muted);line-height:1.5">
         Empty. Tap "Edit list" and add a few things you'd actually do — they stay on this phone.</div>`
      : `<div class="mt3"><div style="font-size:17px;min-height:26px;color:${picked?C.text:C.muted}">${picked||"Tap spin when the urge hits."}</div>
         <div class="mt3" style="display:flex;gap:8px">
           <button data-act="spin" ${picked&&rerolls>=1?"disabled":""} style="flex:1;padding:13px 0;border-radius:4px;
             font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
             ${picked?`border:1px solid var(--line);color:var(--text);opacity:${rerolls>=1?.4:1}`:`background:${C.purple};color:#12101C;box-shadow:${glow(C.purple,14)}`}">
             ${picked?(rerolls>=1?"No more rerolls":"Reroll"):"Spin"}</button>
           ${picked?`<button data-act="didit" style="flex:1;padding:13px 0;border-radius:4px;background:${C.purple};
             color:#12101C;box-shadow:${glow(C.purple,14)};font-family:var(--mono);font-size:12px;
             letter-spacing:.14em;text-transform:uppercase;font-weight:600">Did it</button>`:""}
         </div></div>`}
  </div>`);

  /* noise */
  const noiseHist=strip.filter(ds=>S.days[ds]&&S.days[ds].noise);
  h.push(`<div class="card pad mt2">
    <div class="row" style="align-items:baseline">
      <span style="font-size:16px">Noise</span>
      <span class="mono" style="font-size:10px;color:var(--muted)">worst it got today</span></div>
    <div class="mt3" style="display:flex;gap:6px">
      ${[1,2,3,4,5].map(n=>{
        const on=d.noise===n, c=noiseCol(n);
        return `<button data-act="noise" data-n="${n}" style="flex:1;height:52px;border-radius:4px;
          border:1px solid ${on?c:C.line};background:${on?c+"22":"var(--surface)"};
          box-shadow:${on?glow(c,10):"none"};font-family:var(--mono);font-size:19px;
          color:${on?c:C.muted};text-shadow:${on?tglow(c,10):"none"}">${n}</button>`}).join("")}
    </div>
    <div class="row mt2">
      <span class="mono" style="font-size:10px;color:var(--muted)">1 could settle · 5 nothing worked</span>
      ${d.noise?`<button class="link" data-act="clearnoise">Clear</button>`:""}
    </div>
    ${noiseHist.length?`<div class="chart mt3" style="height:30px">${strip.map(ds=>{
      const n=S.days[ds]?S.days[ds].noise:null;
      const hh=n?Math.max(3,(n/5)*28):0, c=n?noiseCol(n):C.line;
      return `<div style="height:30px"><div style="position:absolute;bottom:0;width:100%;height:${hh}px;
        background:${c};box-shadow:${hh?glow(c,6):"none"};border-radius:2px;opacity:.9"></div></div>`}).join("")}</div>
      <div class="mono mt2" style="font-size:10px;color:var(--muted)">last 14 days</div>`:""}
  </div>`);

  /* BP */
  h.push(`<div class="card pad mt2">
    <div class="row"><span style="font-size:16px">Blood pressure</span>
    ${d.bp?`<span class="mono" style="font-size:20px">${d.bp[0]}/${d.bp[1]}</span>`
      :`<div style="display:flex;align-items:center;gap:8px">
        <input id="sys" class="field" inputmode="numeric" placeholder="120" style="width:58px">
        <span style="color:var(--muted)">/</span>
        <input id="dia" class="field" inputmode="numeric" placeholder="80" style="width:58px">
        <button class="mono" data-act="logbp" style="height:44px;padding:0 12px;background:var(--surfaceHi);
          border:1px solid var(--line);border-radius:4px;font-size:11px;letter-spacing:.12em">ADD</button></div>`}
    </div>
    <div class="mono mt2" style="font-size:11px;color:var(--muted)">Optional — take it when you take it.</div></div>`);

  /* BP trend */
  const bpAll=Object.keys(S.days).filter(k=>S.days[k].bp).sort();
  if(bpAll.length>=2){
    const pts=bpAll.map(k=>({d:k,s:S.days[k].bp[0],p:S.days[k].bp[1]}));
    const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;
    const recent=pts.filter(p=>between(p.d,today)<=7);
    const prior=pts.filter(p=>between(p.d,today)>7&&between(p.d,today)<=14);
    const rs=avg(recent.map(p=>p.s)), rp=avg(recent.map(p=>p.p));
    const ps=avg(prior.map(p=>p.s)), pp=avg(prior.map(p=>p.p));
    const show=pts.slice(-20);
    const sysVals=show.map(p=>p.s), diaVals=show.map(p=>p.p);
    const lo=Math.min.apply(null,diaVals)-8, hi=Math.max.apply(null,sysVals)+8, span=Math.max(hi-lo,1);
    const H=76;
    const xy=(v,i)=>[(i/(Math.max(show.length-1,1)))*100, H-((v-lo)/span)*H];
    const path=vals=>vals.map((v,i)=>{const a=xy(v,i);return (i?"L":"M")+a[0].toFixed(1)+" "+a[1].toFixed(1)}).join(" ");
    const line=y=>H-((y-lo)/span)*H;
    const ds_=(rs!==null&&ps!==null)?rs-ps:null;
    const dp_=(rp!==null&&pp!==null)?rp-pp:null;
    h.push(`<div class="card pad mt6">
      <div class="row" style="align-items:baseline">
        <span class="eyebrow">Blood pressure</span>
        <span class="mono" style="font-size:10px;color:var(--muted)">${pts.length} readings</span></div>
      <div class="row mt2" style="align-items:flex-end">
        <div class="mono" style="font-size:34px;line-height:1;font-weight:600;text-shadow:${tglow(C.text,10)}">
          ${rs||"—"}<span style="font-size:20px;color:var(--muted)">/${rp||"—"}</span></div>
        ${ds_!==null?`<div style="text-align:right">
          <div class="mono" style="font-size:17px;line-height:1;color:${ds_<=0?C.green:C.amber}">
            ${ds_>0?"+":""}${ds_}/${dp_>0?"+":""}${dp_}</div>
          <div class="eyebrow" style="font-size:9px;margin-top:4px">vs week before</div></div>`:""}
      </div>
      <div class="mono mt2" style="font-size:10px;color:var(--muted)">7-day average</div>
      <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="width:100%;height:96px;margin-top:12px;overflow:visible">
        ${[140,130,120,90,80].filter(v=>v>lo&&v<hi).map(v=>
          `<line x1="0" y1="${line(v).toFixed(1)}" x2="100" y2="${line(v).toFixed(1)}"
            stroke="${C.line}" stroke-width="0.5" vector-effect="non-scaling-stroke"/>`).join("")}
        <path d="${path(sysVals)}" fill="none" stroke="${C.amber}" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        <path d="${path(diaVals)}" fill="none" stroke="${C.teal}" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      </svg>
      <div class="row mt2">
        <span class="mono" style="font-size:10px;color:${C.amber}">systolic</span>
        <span class="mono" style="font-size:10px;color:${C.teal}">diastolic</span></div>
      <div class="mono mt2" style="font-size:10px;color:var(--muted)">
        ${show[0].d.slice(5)} to ${show[show.length-1].d.slice(5)}</div>
    </div>`);
  }

  /* strip */
  h.push(`<div class="row mt6" style="align-items:baseline">
    <span class="eyebrow">Last 14 days</span>
    <span class="mono" style="font-size:10px;color:var(--muted)">scored vs target</span></div>
    <div class="strip mt2">${strip.map(ds=>{
      const c=sectorColor(ds), on=S.days[ds]&&S.days[ds].touched;
      return `<div style="background:${c};opacity:${on?1:.5};box-shadow:${on?glow(c,8):"none"};
        outline:${ds===today?"2px solid "+C.text:"none"};outline-offset:1px"></div>`}).join("")}</div>`);

  /* stats */
  h.push(`<div class="eyebrow mt6">Last 28 days</div>
    <div class="grid3 mt2">
      ${[["Drinks / wk",perWeek,C.text],
         ["On plan",dd.length?onPlanDays+"/"+dd.length:"—",onPlanDays?C.green:C.muted],
         ["Last BP",lastBP?lastBP[0]+"/"+lastBP[1]:"—",C.text]]
        .map(([l,v,c])=>`<div class="card" style="padding:12px">
          <div class="eyebrow" style="font-size:9px">${l}</div>
          <div class="mono" style="font-size:19px;margin-top:6px;color:${c}">${v}</div></div>`).join("")}
    </div>`);

  /* upgrade gate */
  h.push(`<div class="card pad mt6" style="border-color:${canClaim?C.purple:C.line}">
    <div class="row" style="align-items:baseline"><span class="eyebrow">Next upgrade</span>
      <span class="mono" style="font-size:12px;color:${canClaim?C.purple:C.muted}">${logged}/5 days</span></div>
    <div class="mt3" style="display:flex;gap:4px">${Array.from({length:5}).map((_,i)=>
      `<div style="flex:1;height:4px;border-radius:2px;background:${i<logged?C.purple:C.line};
        box-shadow:${i<logged?glow(C.purple,6):"none"}"></div>`).join("")}</div>
    <div class="mt4"><div style="font-size:16px;color:${canClaim?C.text:C.muted}">${(S.claimed||0)+1}. ${up[0]}</div>
      <div style="font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5">${up[1]}</div></div>
    ${canClaim?`<button class="btn-primary mt4" data-act="claim">Unlocked — ask Claude to build it</button>`
      :`<div class="mono mt4" style="font-size:11px;color:var(--muted)">${5-logged} more logged days this week.</div>`}
    <button class="link mt3" data-act="roadmap">${showRoadmap?"Hide":"See"} all 12</button>
    ${showRoadmap?`<div class="mt3">${UPGRADES.map((u,i)=>`<div style="display:flex;gap:12px;padding:8px 0;
      border-top:1px solid var(--line);opacity:${i<(S.claimed||0)?.45:1}">
      <span class="mono" style="font-size:12px;min-width:18px;color:${i<(S.claimed||0)?C.green:C.muted}">${i<(S.claimed||0)?"✓":String(i+1).padStart(2,"0")}</span>
      <div><div style="font-size:14px">${u[0]}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45">${u[1]}</div></div></div>`).join("")}</div>`:""}
  </div>`);

  /* footer */
  h.push(`<div class="row mt6">
    <span style="display:flex;gap:14px">
      <button class="link" data-act="backup">Back up</button>
      <button class="link" data-act="restore">Restore</button>
      <button class="link" data-act="export">Export data</button>
      ${backupMsg?`<span class="mono" style="font-size:10px;color:var(--muted)">${backupMsg}</span>`:""}</span>
    <span class="mono" style="font-size:11px;color:${storageOk?C.green:C.red}">
      ${!storageOk?"NOT SAVING":S.lastSave?"saved "+new Date(S.lastSave).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"nothing saved yet"}</span></div>`);
  if(showRestore) h.push(`<div class="card pad mt2">
    <div class="eyebrow">Restore from a backup</div>
    <div style="font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5">
      Pick a backup file, or paste the text.</div>
    <input type="file" id="restorefile" accept=".txt,.json,text/plain,application/json" style="display:none">
    <button class="btn-ghost mt3" data-act="pickfile">Choose file</button>
    <textarea id="pastebox" class="mt3" placeholder="…or paste here" style="width:100%;height:90px;
      background:var(--surfaceHi);border:1px solid var(--line);border-radius:4px;color:var(--text);
      font-family:var(--mono);font-size:11px;padding:8px"></textarea>
    <button class="btn-ghost mt2" data-act="checkpaste">Check pasted text</button>
    ${restoreMsg?`<div class="mt3" style="font-size:13px;color:${pendingRestore?C.amber:C.red};line-height:1.5">${restoreMsg}</div>`:""}
    ${pendingRestore?`<button class="btn-primary mt3" data-act="dorestore">Replace my data</button>`:""}
  </div>`);
  if(showExport) h.push(`<textarea readonly class="mt2" style="width:100%;height:130px;background:var(--surface);
    border:1px solid var(--line);border-radius:4px;color:var(--muted);font-family:var(--mono);font-size:10px;padding:8px"
    onfocus="this.select()">${JSON.stringify(S,null,2).replace(/</g,"&lt;")}</textarea>
    <div class="mono mt2" style="font-size:10px;color:var(--muted)">Tap to select all. Email it to yourself now and then.</div>`);

  h.push(`<div class="row mt8">
    <span class="mono" style="font-size:10px;color:var(--muted)">v${VERSION} · ${BUILT}</span>
    <span style="display:flex;gap:14px">
      <button class="link" style="font-size:9px" data-act="sample">Sample</button>
      <button class="link" style="font-size:9px;color:${confirmWipe?C.red:C.muted}" data-act="wipe">${confirmWipe?"Tap to confirm":"Wipe"}</button>
    </span></div>`);

  const app=document.getElementById("app");
  const active=document.activeElement, aid=active?active.id:null;
  const pos=active&&active.selectionStart!=null?active.selectionStart:null;
  app.innerHTML=h.join("");
  if(aid){const el=document.getElementById(aid); if(el){el.focus();
    if(pos!=null&&el.setSelectionRange){try{el.setSelectionRange(pos,pos)}catch(e){}}}}
}

/* ---------------- restore ---------------- */
let showRestore=false, pendingRestore=null, restoreMsg="";
function stage(text){
  try{
    const p=JSON.parse(text);
    if(!p||typeof p!=="object"||!p.days) throw 0;
    pendingRestore=p;
    restoreMsg=Object.keys(p.days).length+" days found. This replaces everything currently on this phone.";
  }catch(e){ pendingRestore=null; restoreMsg="That doesn't look like a Stint backup."; }
  render();
}

/* ---------------- backup ---------------- */
let backupMsg="";
async function doBackup(){
  const name="stint-"+today+".txt";
  const json=JSON.stringify(S,null,2);
  // 1. share sheet with a file attached — must fire inside the click, no render first
  try{
    const file=new File([json],name,{type:"text/plain"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name,text:""});
      backupMsg="sent to share sheet"; render(); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){backupMsg="cancelled";render();return;} }
  // 2. share sheet with text only
  try{
    if(navigator.share){
      await navigator.share({title:name,text:json});
      backupMsg="sent as text"; render(); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){backupMsg="cancelled";render();return;} }
  // 3. plain download
  try{
    const url=URL.createObjectURL(new Blob([json],{type:"text/plain"}));
    const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    backupMsg="downloaded "+name; render(); return;
  }catch(e){}
  // 4. last resort: show the text to copy
  showExport=true; backupMsg="couldn't share — copy the text below"; render();
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, d=day();
  if(a==="med") patch({[b.dataset.k]: !(d[b.dataset.k]??d.meds)});
  else if(a==="wegovy") patch({wegovy:!d.wegovy});
  else if(a==="teeth") patch({[b.dataset.k]: !d[b.dataset.k]});
  else if(a==="noise") patch({noise:parseInt(b.dataset.n,10)});
  else if(a==="clearnoise") patch({noise:null});
  else if(a==="dminus") patch({drinks:Math.max(0,(d.drinks||0)-1)});
  else if(a==="dplus") patch({drinks:(d.drinks||0)+1});
  else if(a==="dzero") patch({drinks:0});
  else if(a==="edittaper"){editTaper=true;render()}
  else if(a==="canceltaper"){editTaper=false;render()}
  else if(a==="savetaper"){
    const g=id=>parseInt(document.getElementById(id).value,10);
    const s=g("tStart"),st=g("tStep"),ev=g("tEvery"),fl=g("tFloor");
    if(!s||!st||!ev||isNaN(fl)) return;
    S.taper={startDate:today,startDrinks:s,step:st,everyDays:ev,floor:fl};
    editTaper=false;save();render();}
  else if(a==="editlabels"){editLabels=!editLabels;render()}
  else if(a==="savelabels"){
    S.medLabels={am:document.getElementById("labAm").value.trim(),
                 pm:document.getElementById("labPm").value.trim(),
                 weekly:document.getElementById("labWk").value.trim()};
    editLabels=false;save();render();}
  else if(a==="editswaps"){editSwaps=!editSwaps;render()}
  else if(a==="rmswap"){S.swaps=swaps().filter(x=>x!==decodeURIComponent(b.dataset.s));save();render()}
  else if(a==="addswap"){const el=document.getElementById("newswap");const v=el.value.trim();
    if(v&&!swaps().includes(v)){S.swaps=swaps().concat([v]);save();render()}}
  else if(a==="spin"){
    const yest=S.days[addDays(today,-1)]?S.days[addDays(today,-1)].swapWhat:null;
    const pool=swaps().filter(s=>s!==picked&&s!==yest);
    const from=pool.length?pool:swaps();
    if(picked) rerolls++;
    picked=from[Math.floor(Math.random()*from.length)];render();}
  else if(a==="didit"){patch({swap:true,swapWhat:picked});picked=null;rerolls=0;}
  else if(a==="undoswap") patch({swap:false,swapWhat:null});
  else if(a==="logbp"){const s=parseInt(document.getElementById("sys").value,10),
    di=parseInt(document.getElementById("dia").value,10);
    if(s&&di) patch({bp:[s,di]});}
  else if(a==="claim"){S.claimed=(S.claimed||0)+1;save();render()}
  else if(a==="roadmap"){showRoadmap=!showRoadmap;render()}
  else if(a==="export"){showExport=!showExport;render()}
  else if(a==="restore"){showRestore=!showRestore;pendingRestore=null;restoreMsg="";render()}
  else if(a==="pickfile"){document.getElementById("restorefile").click()}
  else if(a==="checkpaste"){stage(document.getElementById("pastebox").value)}
  else if(a==="dorestore"){
    if(pendingRestore){S=pendingRestore;pendingRestore=null;showRestore=false;
      restoreMsg="";save();render();}}
  else if(a==="backup"){ doBackup(); }
  else if(a==="sample"){
    const seed=[10,10,9,10,9,9,8,9,8,null,8,7,9,7],days={};
    for(let i=0;i<14;i++){if(seed[i]===null)continue;
      const ds=addDays(today,-(13-i));
      days[ds]={touched:true,drinks:seed[i],medsAM:i%5!==2,medsPM:i%4!==1,swap:i%3===0};
      if(i===3)days[ds].bp=[148,94]; if(i===11)days[ds].bp=[141,90];}
    S={start:addDays(today,-13),days,claimed:0,demo:true,
       taper:{startDate:addDays(today,-13),startDrinks:10,step:1,everyDays:4,floor:0}};
    save();render();}
  else if(a==="wipe"){
    if(confirmWipe){S={start:today,days:{},claimed:0};confirmWipe=false;save();render()}
    else{confirmWipe=true;render();setTimeout(()=>{confirmWipe=false;render()},4000)}}
});

document.addEventListener("change",e=>{
  if(e.target.id==="restorefile" && e.target.files && e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>stage(String(r.result));
    r.onerror=()=>{restoreMsg="Couldn't read that file.";render()};
    r.readAsText(e.target.files[0]);
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="drinks"){
    const v=e.target.value.replace(/\D/g,"").slice(0,2);
    e.target.value=v;
    if(v!=="") patch({drinks:parseInt(v,10)});
  }
});

render();
</script>
